name: cpu-tests

on:
  pull_request:
  push:
    branches: main

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ['3.8', '3.9', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install -e . girder-client
        python -c "import icon_registration.test_utils as t; t.download_test_data(); print(t.TEST_DATA_DIR)" | tail -n 1 > data_dir.txt
    - name: Test
      run: |
        LUNG=$(cat data_dir.txt)/lung_test_data
        gradiconlung-register --fixed=$LUNG/copd1_highres_EXP_STD_COPD_img.nii.gz --moving=$LUNG/copd1_highres_INSP_STD_COPD_img.nii.gz \
            --transform_out=trans.hdf5 --warped_moving_out=warped.nii.gz --io_iterations=None
        gradiconlung-register --fixed=$LUNG/copd1_highres_EXP_STD_COPD_img.nii.gz --moving=$LUNG/copd1_highres_INSP_STD_COPD_img.nii.gz \
            --transform_out=trans.hdf5 --svf_out=svf.nii.gz --io_iterations=None
        gradiconlung-warp --fixed=$LUNG/copd1_highres_EXP_STD_COPD_img.nii.gz --moving=$LUNG/copd1_highres_INSP_STD_COPD_label.nii.gz \
            --transform=trans.hdf5 --warped_moving_out=warped_seg.nii.gz --nearest_neighbor
        gradiconlung-jacobian --fixed=$LUNG/copd1_highres_EXP_STD_COPD_img.nii.gz --transform=trans.hdf5 --jacob=jacobian.nii.gz
