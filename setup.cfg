[metadata]
name = gradiconlung
version = 1.0.0
author = Basar Demir
author_email = bdemir@ucsd.edu
description = GradICONLung, a GradICON registration model for lung CT
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/uncbiag/GradICONLung
project_urls =
    Bug Tracker = https://github.com/uncbiag/GradICONLung
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux

[options]
package_dir = 
    = src
packages = find:
python_requires = >=3.8

install_requires = 
    icon_registration>=1.1.9
    unigradicon>=1.0.6

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    gradiconlung-register = gradiconlung:main
    gradiconlung-warp = gradiconlung:warp_command
    gradiconlung-jacobian = gradiconlung:compute_jacobian_map_command
